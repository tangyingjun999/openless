name: Build unsigned IPA

on:
  push:
    branches: [beta]
    paths:
      - 'openless-all/ios/**'
      - 'openless-all/app/crates/openless-core/**'
      - '.github/workflows/ios-ipa.yml'
      - '.github/ios/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ios-ipa-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  ipa:
    name: OpenLess iPhone app -> unsigned IPA
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.99.0
        with:
          targets: aarch64-apple-ios

      - name: Toolchain snapshot
        run: |
          sw_vers
          xcodebuild -version
          rustc --version
          cargo --version
          python3 --version
          uname -m

      - name: Build and package IPA
        env:
          OPENLESS_BUILD_JOBS: "4"
        run: |
          set -o pipefail
          bash .github/ios/build-ipa.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Ad-hoc sign for TrollStore (App Group entitlement baked in)
        env:
          OPENLESS_DERIVED_DATA: ${{ runner.temp }}/ios-device
          # Bump per release so TrollStore and iOS always see a new build.
          OPENLESS_BUILD_OFFSET: "3"
        run: python3 .github/ios/sign-trollstore.py

      - name: Publish result (release asset)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash .github/ios/publish.sh

      - name: Upload workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openless-ios-ipa
          path: |
            out/*.ipa
            out/SHA256SUMS
            ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 14
